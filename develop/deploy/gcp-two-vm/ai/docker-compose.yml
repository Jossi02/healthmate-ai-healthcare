services:
  ai-hub-v2:
    build:
      context: ../../../ai-model/v2
      dockerfile: Dockerfile
    image: capstone-ai-hub-v2:latest
    container_name: ai-hub-v2
    env_file:
      - ./.env.ai
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${AI_BIND_ADDRESS:?AI_BIND_ADDRESS must be the VM private interface address}:8000:8000"
    volumes:
      - /var/lib/healthmate/ai/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
